plugins {
    id 'com.android.application' version '9.1.0'
}

// Release signing comes from keystore.properties, which is gitignored; without it the
// release build falls back to the debug key so a fresh clone still builds.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'app.bluetoothtransferunlock'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'app.bluetoothtransferunlock'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        buildConfig false
    }

    signingConfigs {
        release {
            if (!keystoreProps.isEmpty()) {
                storeFile rootProject.file(keystoreProps.storeFile)
                storePassword keystoreProps.storePassword
                keyAlias keystoreProps.keyAlias
                keyPassword keystoreProps.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreProps.isEmpty() ? signingConfigs.debug : signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Provided by the LSPosed framework at runtime; never packaged into the APK.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // libxposed:api publishes no transitive dependencies of its own, and its sources
    // (and ours) are annotated with the androidx nullability markers. Non-transitive so
    // that kotlin-stdlib, which annotation-jvm pulls in, never reaches this APK.
    compileOnly('androidx.annotation:annotation-jvm:1.10.0') { transitive = false }
}
