org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Pure Java module: AGP's built-in Kotlin support would otherwise add kotlin-stdlib to the
# APK, and annotation-jvm is kept non-transitive for the same reason.
kotlin.stdlib.default.dependency=false
